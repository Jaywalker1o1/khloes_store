<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fbf6ef">
  <title>Order details | khloe.s_sweet_treats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body { min-height:100vh; display:grid; place-items:center; padding:24px; }
    .order-page { width:min(650px,100%); background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:clamp(24px,6vw,48px); box-shadow:var(--shadow); }
    .order-brand { display:flex; align-items:center; gap:10px; font-family:'Playfair Display',serif; font-weight:700; margin-bottom:42px; }
    .order-page h1 { font-size:clamp(38px,7vw,58px); letter-spacing:-1px; margin:12px 0 14px; }
    .order-intro { color:var(--muted); line-height:1.6; font-size:14px; }
    .order-status { display:inline-flex; padding:7px 11px; border-radius:5px; background:var(--sage); color:#365337; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; }
    .order-details { margin:30px 0 15px; border-top:1px solid var(--line); }
    .order-line { display:grid; grid-template-columns:1fr auto auto; gap:14px; align-items:center; padding:16px 0; border-bottom:1px solid var(--line); font-size:13px; }
    .order-line strong { font-family:'Playfair Display',serif; font-size:17px; font-weight:600; }
    .order-line small { color:var(--muted); display:block; margin-top:4px; }
    .order-total { display:flex; justify-content:space-between; padding:20px 0 5px; font-weight:700; }
    .order-total strong { color:var(--rose-dark); font-size:20px; }
    .order-date { margin-top:25px; color:var(--muted); font-size:11px; }
    .order-back { display:inline-flex; margin-top:30px; color:var(--rose-dark); font-size:12px; font-weight:700; }
    .order-empty { text-align:center; padding:20px 0; color:var(--muted); line-height:1.7; }
  </style>
</head>
<body>
  <main class="order-page" id="orderPage">
    <a class="order-brand" href="index.html"><span class="brand-mark">k</span><span>khloe.s_sweet_treats</span></a>
    <div id="orderContent"><div class="eyebrow">Order details</div><h1>Loading your order...</h1></div>
  </main>
  <script src="supabase-config.js"></script>
  <script src="order.js"></script>
</body>
</html>
